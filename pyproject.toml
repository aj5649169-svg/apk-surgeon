[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-surgeon"
version = "0.1.0"
requires-python = ">=3.10"
description = "Review and selectively disable known Android tracker entry points"
dependencies = ["rich>=13,<16", "lxml>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
apk-surgeon = "apk_surgeon.cli:main"
[tool.setuptools.package-data]
apk_surgeon = ["trackers.json"]
