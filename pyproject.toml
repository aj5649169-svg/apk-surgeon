[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-surgeon"
version = "0.5.1"
requires-python = ">=3.10"
description = "Review and selectively disable known Android tracker entry points"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rich>=13,<16", "lxml>=5,<7", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
apk-surgeon = "apk_surgeon.cli:main"

[tool.setuptools.package-data]
apk_surgeon = ["trackers.json", "ui_assets/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
